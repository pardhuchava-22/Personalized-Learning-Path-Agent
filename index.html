<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumGuard | AI Learning Companion</title>
    <script>
      // Suppress production warnings from Tailwind CDN
      (function() {
        const methods = ['log', 'info', 'warn', 'error'];
        methods.forEach(method => {
          const original = console[method];
          console[method] = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
              return;
            }
            original.apply(console, args);
          };
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Smooth & Momentum Scrolling for Viewports & Main Containers (Prevents coordinate offset bugs for fixed modals) */
      .scroll-opt {
        scroll-behavior: smooth !important;
        -webkit-overflow-scrolling: touch !important;
      }
      
      /* Smooth & Hardware-Accelerated 60fps Scrolling for inner lists & non-fixed panels */
      .scroll-gpu {
        scroll-behavior: smooth !important;
        -webkit-overflow-scrolling: touch !important;
        will-change: scroll-position !important;
        transform: translateZ(0) !important;
        backface-visibility: hidden !important;
      }
      
      /* Elegant Technical Scrollbars */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Subtle & Professional Animation Keyframes */
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.88; transform: scale(1.02); }
      }
      @keyframes warningSoftPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes softGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(195, 245, 60, 0); }
        50% { box-shadow: 0 0 14px 2px rgba(195, 245, 60, 0.4); }
      }
      @keyframes bellRing {
        0%, 80%, 100% { transform: rotate(0deg); }
        84% { transform: rotate(10deg); }
        88% { transform: rotate(-8deg); }
        92% { transform: rotate(6deg); }
        96% { transform: rotate(-4deg); }
      }
      @keyframes flowRight {
        0%, 100% { transform: translateX(0); opacity: 0.6; }
        50% { transform: translateX(4px); opacity: 1; }
      }
      @keyframes flowDown {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(3px); opacity: 1; }
      }
      @keyframes aiSparkle {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
        50% { transform: scale(1.12) rotate(8deg); opacity: 1; filter: drop-shadow(0 0 6px rgba(195, 245, 60, 0.6)); }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes typingWave {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-4px); opacity: 1; }
      }
      @keyframes softHighlight {
        0%, 100% { box-shadow: 0 0 0 0 rgba(99, 91, 255, 0); }
        50% { box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.18); }
      }

      .animate-gentle-float {
        animation: gentleFloat 3.5s ease-in-out infinite;
      }
      .animate-subtle-pulse {
        animation: subtlePulse 2.8s ease-in-out infinite;
      }
      .animate-warning-pulse {
        animation: warningSoftPulse 2.2s ease-in-out infinite;
      }
      .animate-soft-glow {
        animation: softGlow 2.8s ease-in-out infinite;
      }
      .animate-soft-highlight {
        animation: softHighlight 2.4s ease-in-out infinite;
      }
      .animate-bell-ring {
        animation: bellRing 3.5s ease-in-out infinite;
      }
      .animate-flow-right {
        animation: flowRight 2.2s ease-in-out infinite;
      }
      .animate-flow-down {
        animation: flowDown 2s ease-in-out infinite;
      }
      .animate-ai-sparkle {
        animation: aiSparkle 3s ease-in-out infinite;
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .animate-typing-dot-1 {
        animation: typingWave 1.4s infinite ease-in-out;
      }
      .animate-typing-dot-2 {
        animation: typingWave 1.4s infinite ease-in-out 0.2s;
      }
      .animate-typing-dot-3 {
        animation: typingWave 1.4s infinite ease-in-out 0.4s;
      }

      /* Stagger Delays */
      .stagger-1 { animation-delay: 80ms; }
      .stagger-2 { animation-delay: 160ms; }
      .stagger-3 { animation-delay: 240ms; }
      .stagger-4 { animation-delay: 320ms; }
      .stagger-5 { animation-delay: 400ms; }

      /* Reduced motion compliance */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: '#c3f53c', // Acid/Lime Green
                dark: '#addb2c',
                light: '#e1ff80',
              },
              secondary: {
                DEFAULT: '#111217', // Charcoal
              },
              success: '#10B981',
              warning: '#F59E0B',
              error: '#EF4444',
              charcoal: {
                DEFAULT: '#111217',
                light: '#1c1e26',
                border: '#e2e8f0',
                canvas: '#f8fafc',
              },
              slate: {
                850: '#1c1e26', // Custom dark slate
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'wave': 'wave 2.5s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              wave: {
                '0%': { transform: 'rotate(0.0deg)' },
                '10%': { transform: 'rotate(14.0deg)' },
                '20%': { transform: 'rotate(-8.0deg)' },
                '30%': { transform: 'rotate(14.0deg)' },
                '40%': { transform: 'rotate(-4.0deg)' },
                '50%': { transform: 'rotate(10.0deg)' },
                '60%': { transform: 'rotate(0.0deg)' },
                '100%': { transform: 'rotate(0.0deg)' },
              }
            }
          },
        },
      }
    </script>

}

</head>

</html>
